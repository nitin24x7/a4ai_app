name: a4ai
description: "A hybrid mobile platform for a4ai."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: 4.12.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  app_links: ^6.3.4
  flutter_native_splash: ^2.4.4
  path_provider: ^2.1.4
  open_file: ^3.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"